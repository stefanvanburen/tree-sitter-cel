version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: "monthly"
      time: "08:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 7
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: "monthly"
      time: "08:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 7
    # go-tree-sitter is pre-1.0, so a minor release can break, and a require
    # in go.mod is a minimum for every module that imports this one.
    ignore:
      - dependency-name: github.com/tree-sitter/go-tree-sitter
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: "monthly"
      time: "08:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 7
    # The manifest's ranges are what consumers get; only the lockfile is ours.
    versioning-strategy: lockfile-only
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: "monthly"
      time: "08:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 7
    # The manifest's ranges are what consumers get; only the lockfile is ours.
    versioning-strategy: lockfile-only
